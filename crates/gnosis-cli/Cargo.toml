[package]
name = "gnosis-cli"
version = "0.1.0"
edition = "2024"
description = "Local semantic search and related-notes for a markdown knowledge base"

[[bin]]
name = "gnosis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "5.17.2"
ignore = "0.4.26"
blake3 = "1.8.5"
pulldown-cmark = "0.13.4"
dirs = "6.0.0"
