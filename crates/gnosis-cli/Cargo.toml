[package]
name = "gnosis-cli"
version = "0.1.0"
edition = "2024"
description = "Local semantic search and related-notes for a markdown knowledge base"

[[bin]]
name = "gnosis"
path = "src/main.rs"

[dependencies]
chunker = { workspace = true }
embed = { workspace = true }
fs = { workspace = true }
index = { workspace = true }
progress = { workspace = true }
search = { workspace = true }
store = { workspace = true }
walk = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "5.17.2"
ignore = "0.4.26"
indicatif = "0.17"
usearch = "2"
dirs = "6.0.0"
