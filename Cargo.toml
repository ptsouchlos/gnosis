[workspace]
members = [
    "crates/gnosis-cli",
    "crates/gnosis-chunker",
    "crates/gnosis-embed",
    "crates/gnosis-eval",
    "crates/gnosis-fs",
    "crates/gnosis-index",
    "crates/gnosis-parse",
    "crates/gnosis-progress",
    "crates/gnosis-search",
    "crates/gnosis-store",
    "crates/gnosis-walk",
]
resolver = "3"

[workspace.dependencies]
# Workspace member crates
chunker = { path = "crates/gnosis-chunker" }
embed = { path = "crates/gnosis-embed" }
eval = { path = "crates/gnosis-eval" }
fs = { path = "crates/gnosis-fs" }
index = { path = "crates/gnosis-index" }
parse = { path = "crates/gnosis-parse" }
progress = { path = "crates/gnosis-progress" }
search = { path = "crates/gnosis-search" }
store = { path = "crates/gnosis-store" }
walk = { path = "crates/gnosis-walk" }

# dependencies
anyhow = "1"
blake3 = "1.8.5"
# Pure-Rust deflate, for the portable artifact's text blocks. Chosen over a
# zlib binding so the same code compresses natively and decompresses in wasm,
# and held at the version `image` already pulls in so the binary carries one
# copy rather than two.
miniz_oxide = "0.8.9"
pdf-extract = "0.12.1"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
