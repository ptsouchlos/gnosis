[workspace]
members = [
    "crates/gnosis-cli",
    "crates/gnosis-chunker",
    "crates/gnosis-embed",
    "crates/gnosis-eval",
    "crates/gnosis-fs",
    "crates/gnosis-index",
    "crates/gnosis-parse",
    "crates/gnosis-progress",
    "crates/gnosis-query",
    "crates/gnosis-search",
    "crates/gnosis-store",
    "crates/gnosis-walk",
    "crates/gnosis-wasm",
]
resolver = "3"

# One version for every crate: a release tag names it, and the release
# workflow refuses a tag that does not match.
[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace member crates
chunker = { path = "crates/gnosis-chunker" }
embed = { path = "crates/gnosis-embed" }
eval = { path = "crates/gnosis-eval" }
fs = { path = "crates/gnosis-fs" }
index = { path = "crates/gnosis-index" }
parse = { path = "crates/gnosis-parse" }
progress = { path = "crates/gnosis-progress" }
query = { path = "crates/gnosis-query" }
search = { path = "crates/gnosis-search" }
store = { path = "crates/gnosis-store" }
walk = { path = "crates/gnosis-walk" }

# dependencies
anyhow = "1"
blake3 = "1.8.5"
# Pure-Rust deflate, for the portable artifact's text blocks. Chosen over a
# zlib binding so the same code compresses natively and decompresses in wasm,
# and held at the version `image` already pulls in so the binary carries one
# copy rather than two.
miniz_oxide = "0.8.9"
pdf-extract = "0.12.1"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The wasm query client's build profile. Size matters there and nowhere else —
# a client is downloaded over someone's network every time the plugin updates —
# so it is a separate profile rather than a change to `release`, which builds
# the CLI's indexer and wants speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
