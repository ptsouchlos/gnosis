# cargo-about's config for the wasm bundle's third-party notices
# (script/release/notices.sh). The crates are the wasm query client's
# dependency graph for its own target, so nothing native-only is listed.
#
# Order matters: for a crate offered under a choice of licenses, the first one
# here that the crate offers is the one its notice is written for.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# gnosis's own crates (publish = false): LICENSE covers them.
private = { ignore = true }
